[pytest]
# Тесты лежат рядом с backend; корень репозитория — в sys.path,
# чтобы импорт `backend.app...` работал так же, как у uvicorn в Procfile.
testpaths = backend/tests
pythonpath = .
# Строгий xfail: тест известного бага, который вдруг прошёл, — это сигнал
# «баг исправлен, сними маркер», а не тихий зелёный результат.
xfail_strict = true
