# Тесты на каждый push и pull request.
#
# Python 3.11 — как на Render (render.yaml: PYTHON_VERSION). Node ставится явно:
# часть тестов запускает настоящие i18n.js/ui.js в node и без него пропускается —
# в CI пропуск выглядел бы зелёным прогоном. Chromium — для браузерного
# smoke-теста (backend/tests/e2e): env CI превращает его пропуск в ошибку.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    # Образ закреплён: ubuntu-latest с 2026-10 — Ubuntu 26.04, а Playwright под неё
    # Chromium не ставит («does not support chromium on ubuntu26.04») — CI падал
    # на установке, не дойдя до тестов. Снять, когда Playwright добавит 26.04
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-e2e.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt -r requirements-e2e.txt
          python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest -q -rs
