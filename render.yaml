services:
  - type: web
    name: minmaxapp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # Прокси Render дописывает адрес клиента в конец X-Forwarded-For — лимит
      # обратной связи берёт запись на этой позиции с конца. Сверить по журналу
      # («X-Forwarded-For из N записей»): за Cloudflare узлов может быть больше
      - key: TRUSTED_PROXY_HOPS
        value: "1"
