openapi: "3.1.0"
info:
  title: MINMAX Ventilation Engineering API
  version: "1.0.0-draft"
  summary: Расчёт воздухообмена и тепла для птичников — проектирование и потребность «сейчас»
  description: |
    Публичный контракт /api/v1 (черновик на согласование, 2026-10-19).

    * **Без состояния:** каждый запрос несёт все входные данные; сохранённые на
      сервере настройки фермы и калибровки в ответ не подмешиваются.
    * **Единицы — СИ**, единица — в имени поля: `_m3h`, `_kw`, `_c`, `_pct`, `_m`.
    * **Источники в ответе:** каждая норма и коэффициент, использованные в
      расчёте, перечислены в `sources`, допущения — в `assumptions`.
    * **Ошибки** — RFC 7807 (`application/problem+json`) с машинным `code`.
    * Мы отдаём, **сколько нужно**; сопоставление с фактическим оборудованием —
      на стороне клиента.
  contact:
    name: MINMAXapp
    url: https://github.com/MikeVances/MINMAXapp
  license:
    name: См. репозиторий
    url: https://github.com/MikeVances/MINMAXapp

servers:
  # «.» — относительно адреса самого документа (…/api/v1/openapi.yaml): за прокси
  # (/deploy/proxy/minmax/) путь «/api/v1» от корня хоста ушёл бы мимо приложения
  - url: .
    description: Рядом с этим документом — GET {площадка}/api/v1/openapi.yaml

security:
  - ApiKey: []

tags:
  - name: Design
    description: Сценарий 1 — проектный расчёт помещения на весь цикл
  - name: Requirements
    description: Сценарий 2 — потребность в воздухе и тепле при текущих условиях
  - name: Catalog
    description: Справочники — конструкции, профили роста, способы содержания
  - name: Climate
    description: Расчётные наружные условия по координатам (ERA5 / Open-Meteo)

paths:
  /ventilation-designs:
    post:
      tags: [Design]
      operationId: createVentilationDesign
      summary: Проектный расчёт вентиляции и обогрева на цикл
      description: |
        Воздухообмен по дням цикла (Qmin — CO₂ и влага, Qmax — тепловой баланс и
        туннель), расчётная мощность обогрева при зимней расчётной температуре и
        подбор оборудования по нормам. Результат не сохраняется — ресурс
        создаётся и сразу возвращается (201 без Location).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesignRequest" }
            examples:
              broiler_house:
                summary: Бройлерник 120 × 16 м, сэндвич-панели, Краснодар
                value:
                  house: { length_m: 120, width_m: 16, wall_height_m: 2.5, ridge_height_m: 4.5, altitude_m: 30 }
                  envelope:
                    walls: { layers: [{ material_id: steel, thickness_mm: 0.5 }, { material_id: pir_core, thickness_mm: 100 }, { material_id: steel, thickness_mm: 0.5 }] }
                    roof: { u_w_m2k: 0.21 }
                  flock: { birds: 30000, growth_profile_id: ross308, cycle_days: 42, housing: floor_litter }
                  climate: { winter_design_c: -9.8, summer_design_db_c: 35.6, summer_design_rh_pct: 28 }
      responses:
        "201":
          description: Расчёт выполнен
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesignResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /ventilation-requirements:
    post:
      tags: [Requirements]
      operationId: createVentilationRequirement
      summary: Сколько воздуха и тепла нужно сейчас и какие есть риски
      description: |
        Для внешней системы или агента: текущий возраст, поголовье и погода →
        требуемые Qmin/Qmax, цель скорости туннеля, потребность в тепле и
        риски (влага вне контроля, конденсат, нехватка горелок). Сравнение с
        тем, что сейчас включено, делает клиент.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequirementRequest" }
            examples:
              day_21_cold:
                summary: День 21, мороз, газовые горелки 300 кВт
                value:
                  house: { length_m: 120, width_m: 16, wall_height_m: 2.5, ridge_height_m: 4.5 }
                  envelope: { ua_w_per_k: 3200 }
                  flock: { birds: 30000, growth_profile_id: ross308, age_days: 21, housing: floor_litter, target_rh_pct: 60 }
                  conditions: { outdoor_t_c: -12, outdoor_rh_pct: 85 }
                  heaters: { type: gas_open, power_kw: 300 }
      responses:
        "201":
          description: Расчёт выполнен
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequirementResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /construction-materials:
    get:
      tags: [Catalog]
      operationId: listConstructionMaterials
      summary: Справочник материалов ограждений (λ, источник)
      description: |
        Небольшой ограниченный справочник (десятки записей) — без пагинации.
        U считается сервером по ISO 6946: U = 1 / (R_si + Σ d/λ + R_se), R_se 0.04,
        R_si 0.13 у стен и 0.10 у кровли (поток вверх; скат круче 60° — как стена).
        Значения — BRE BR 443 (2019) §3/§4.3 по BS EN ISO 10456 и 6946.
      responses:
        "200":
          description: Список материалов
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ConstructionMaterial" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /growth-profiles:
    get:
      tags: [Catalog]
      operationId: listGrowthProfiles
      summary: Профили роста кроссов (встроенные — с источником)
      description: Ограниченный справочник — без пагинации.
      responses:
        "200":
          description: Список профилей
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/GrowthProfileSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /growth-profiles/{profile_id}:
    get:
      tags: [Catalog]
      operationId: getGrowthProfile
      summary: Профиль кросса по дням — масса, уставка температуры и влажности
      description: |
        Таблица по дням без расчёта корпуса. У встроенных профилей точка на каждый
        день (0–56); у пользовательских пропуски достроены линейно — `interpolated`.
        Источник у каждой колонки свой (`sources.weight`, `sources.climate`): у
        встроенных профилей масса — таблица производителя кросса, температура — по
        методике производителя (`sources.climate.method`, запись справочника —
        `sources.climate.source_id`): Aviagen (Ross, Arbor Acres) — по массе и RH (Ross
        2025 табл. 2.5); Cobb 500 — по возрасту и RH до 14-го дня, затем по плотности
        посадки (Cobb 2021 §5.2); Hubbard — по возрасту без поправки на RH.
        `temp_c` — уставка при RH профиля. Уставку дня с учётом целевой RH и (у Cobb)
        плотности посадки даёт только расчёт — `target_temp_c`; у Cobb после 14-го дня
        `temp_c` — значения без плотности (Ross), их расчёт берёт только в клетках.
      parameters:
        - name: profile_id
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$", example: cobb500 }
      responses:
        "200":
          description: Профиль по дням
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrowthProfileDays" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /sources:
    get:
      tags: [Catalog]
      operationId: listSources
      summary: Справочник источников расчёта — все записи
      description: |
        Каждый `source_id`, который отдаёт расчёт (`sources`, `assumptions`,
        `equipment`, справочники), есть здесь. Текст — наш выверенный пересказ на
        русском, а не цитата документа: что утверждает источник, как калькулятор его
        применяет и где модель от него отличается (`limits`). `kind` говорит, чего
        источник стоит: норма, руководство производителя, практика со слов владельца
        или неустановленный первоисточник. Десятки записей — без пагинации.
      responses:
        "200":
          description: Список источников
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SourceDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /sources/{source_id}:
    get:
      tags: [Catalog]
      operationId: getSource
      summary: Источник по метке из ответа расчёта — что утверждает, как применён, ограничения
      description: |
        Метка `growth_profile` в `sources` ответа расчёта — не запись справочника:
        источник массы профиля смотрите в `getGrowthProfile` (`sources.weight`).
      parameters:
        - name: source_id
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9_]{0,63}$", example: cobb_2021_9_7 }
      responses:
        "200":
          description: Запись справочника
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /housing-systems:
    get:
      tags: [Catalog]
      operationId: listHousingSystems
      summary: Способы содержания и их статус поддержки
      description: |
        `floor_litter` — CIGR 2002, уровень корпуса (испарение из подстилки
        уже внутри формулы). `cages` — помёт на лентах, отдельной формулы
        для клеточных бройлеров нет: деление тепла берётся по худшему случаю
        для каждой величины (см. README, «Клетки») с допущением
        `cages_heat_split_bounded`. Туннель — по свободному сечению
        (`house.cage_rows`): цель 4–5 м/с в проходах, чтобы у птицы в клетках
        было ~2–2.5 м/с (`cages_bird_speed_from_aisle`).
      responses:
        "200":
          description: Список способов содержания
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/HousingSystem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /climate-designs:
    get:
      tags: [Climate]
      operationId: getClimateDesign
      summary: Расчётные наружные условия по координатам
      description: |
        ASHRAE Fundamentals гл. 14 по 10 годам часового ERA5 (Open-Meteo, CC BY 4.0,
        бесплатный доступ — некоммерческий). Первый запрос по точке ~20 с, затем
        результат кэшируется (ключ — координаты, округлённые до 0.1°).
      parameters:
        - name: latitude
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: longitude
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
      responses:
        "200":
          description: Расчётные условия
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClimateDesign" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Ключ выдаёт владелец площадки (переменная API_KEYS). Если ключи на площадке
        не заданы — доступ открыт (как WRITE_TOKEN: локальная разработка и LAN).
        Этот документ отдаётся без ключа. Лимиты на ключ в минуту: расчёты — 60,
        справочники — 300, климат — 10; сверх — 429 с Retry-After.

  headers:
    RequestId:
      description: Идентификатор запроса — для поиска в журнале сервера
      schema: { type: string }
    CacheControl:
      description: Справочники и климат кэшируются клиентом
      schema: { type: string, example: "public, max-age=3600" }
    RetryAfter:
      description: Через сколько секунд повторить
      schema: { type: integer }

  responses:
    BadRequest:
      description: Запрос не разобран
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Нет или неверный X-API-Key
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Ссылка на несуществующий справочный объект (профиль, материал)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unprocessable:
      description: Данные разобраны, но расчёт по ним невозможен или вне допустимых пределов
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Превышен лимит частоты
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UpstreamUnavailable:
      description: Внешний источник данных (Open-Meteo) недоступен
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    # ── Ошибки ────────────────────────────────────────────────────────────────
    Problem:
      type: object
      description: RFC 7807 Problem Details + машинный код и параметры
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, example: "https://github.com/MikeVances/MINMAXapp/blob/main/docs/api/v1/errors.md#profile_not_found" }
        title: { type: string, example: "Growth profile not found" }
        status: { type: integer, example: 404 }
        detail: { type: string, example: "Growth profile 'ross999' does not exist" }
        instance: { type: string, example: "req-7f3a2c1b9e0d", description: "request_id — тот же в X-Request-Id и в журнале сервера" }
        code: { type: string, example: profile_not_found }
        params: { type: object, additionalProperties: true, example: { id: ross999 } }
        errors:
          type: array
          description: Ошибки по полям (422 валидации)
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string, example: "flock.birds" }
              code: { type: string, example: less_than_equal }
              message: { type: string, example: "Input should be less than or equal to 200000" }

    # ── Общие части запросов ──────────────────────────────────────────────────
    House:
      type: object
      required: [length_m, width_m, wall_height_m]
      properties:
        length_m: { type: number, exclusiveMinimum: 0, maximum: 400 }
        width_m: { type: number, exclusiveMinimum: 0, maximum: 60 }
        wall_height_m: { type: number, exclusiveMinimum: 0, maximum: 10 }
        ridge_height_m: { type: number, exclusiveMinimum: 0, maximum: 15, description: "Нет — плоская кровля (= стене)" }
        altitude_m: { type: number, minimum: 0, maximum: 4000, default: 0, description: "Давление площадки по стандартной атмосфере" }
        airtightness:
          description: |
            Герметичность по UGA. Нет — класс `moderate` как допущение
            (`airtightness_class_assumed`). Утечка при 4 Па (ветер, тяга) нужна
            обогреву: зимой обмен воздуха не меньше неё, даже если Qmin меньше.
          allOf: [{ $ref: "#/components/schemas/Airtightness" }]
        cage_rows:
          type: array
          minItems: 1
          maxItems: 20
          description: |
            Поперечное сечение клеточных батарей — обязательно при `housing: cages`
            (нет — 422 `cage_section_missing`). Свободное сечение туннеля =
            сечение корпуса − Σ count·width·height; по нему считается скорость в
            проходах. Одинаковые ряды можно описать одной записью с `count`.
          items: { $ref: "#/components/schemas/CageRow" }

    Airtightness:
      description: |
        Одно из трёх, от грубого к точному. Класс — UGA (Czarick, Fairchild):
        относительная утечка, м² щелей на 1000 м² пола, берётся по ВЕРХНЕЙ
        границе класса (tight 0.48, moderate 0.65, leaky 1.0, very_leaky 1.2) —
        в безопасную для обогрева сторону. ELA с Cd = 1, как в калькуляторе UGA.
      oneOf:
        - type: object
          title: ByClass
          required: [class]
          properties:
            class: { type: string, enum: [tight, moderate, leaky, very_leaky] }
        - type: object
          title: ByRelativeLeakage
          required: [relative_leakage]
          properties:
            relative_leakage: { type: number, exclusiveMinimum: 0, maximum: 5, description: "Из одноточечного теста на статическое давление" }
        - type: object
          title: ByTest
          required: [leak_at_4pa_m3h]
          properties:
            leak_at_4pa_m3h: { type: number, exclusiveMinimum: 0, description: "Из многоточечного теста (Q = C·ΔPⁿ)" }

    FanCurve:
      type: object
      required: [points]
      properties:
        points:
          type: array
          minItems: 2
          maxItems: 12
          description: "Точки каталога по возрастанию давления; расход должен убывать (иначе 422 fan_curve_invalid)"
          items:
            type: object
            required: [static_pressure_pa, flow_m3h]
            properties:
              static_pressure_pa: { type: number, minimum: 0, maximum: 150 }
              flow_m3h: { type: number, exclusiveMinimum: 0, maximum: 100000 }

    CageRow:
      type: object
      required: [width_m, height_m]
      properties:
        count: { type: integer, minimum: 1, maximum: 20, default: 1 }
        width_m: { type: number, exclusiveMinimum: 0, maximum: 5, description: "Ширина батареи поперёк корпуса" }
        height_m: { type: number, exclusiveMinimum: 0, maximum: 10, description: "Высота батареи от пола" }

    Layer:
      description: |
        Материал из справочника ИЛИ λ из декларации продукта (DoP). Утеплителей
        (минвата, EPS, XPS) в справочнике нет намеренно — BR 443 §3 велит брать
        заявленную λ производителя.
      oneOf:
        - type: object
          title: CatalogMaterial
          required: [material_id, thickness_mm]
          properties:
            material_id: { type: string, example: pir_core }
            thickness_mm: { type: number, exclusiveMinimum: 0, maximum: 1000 }
        - type: object
          title: DeclaredLambda
          required: [lambda_w_mk, thickness_mm]
          properties:
            lambda_w_mk: { type: number, minimum: 0.01, maximum: 200, example: 0.040 }
            thickness_mm: { type: number, exclusiveMinimum: 0, maximum: 1000 }

    Surface:
      type: object
      description: Слои снаружи внутрь — или готовый U из паспорта
      oneOf:
        - type: object
          required: [layers]
          properties:
            layers:
              type: array
              minItems: 1
              maxItems: 6
              items: { $ref: "#/components/schemas/Layer" }
        - type: object
          required: [u_w_m2k]
          properties:
            u_w_m2k: { type: number, minimum: 0.05, maximum: 10, description: "Паспорт производителя панели" }

    Envelope:
      description: |
        Теплопотери ограждений: либо измеренный UA (тест остывания), либо
        конструкции по справочнику. Пол и утечки в UA по конструкции не
        входят — утечки задаются `house.airtightness`.
      oneOf:
        - type: object
          title: Measured
          required: [ua_w_per_k]
          properties:
            ua_w_per_k: { type: number, exclusiveMinimum: 0, maximum: 200000 }
        - type: object
          title: ByConstruction
          required: [walls, roof]
          properties:
            walls: { $ref: "#/components/schemas/Surface" }
            roof: { $ref: "#/components/schemas/Surface" }
            end_walls: { $ref: "#/components/schemas/Surface" }

    Flock:
      type: object
      required: [birds, growth_profile_id, housing]
      properties:
        birds: { type: integer, minimum: 1, maximum: 200000 }
        growth_profile_id: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$", example: ross308 }
        housing: { type: string, enum: [floor_litter, cages] }
        mortality_pct: { type: number, minimum: 0, maximum: 100, default: 4 }
        target_rh_pct: { type: number, minimum: 40, maximum: 70, description: "Нет — RH профиля" }

    Climate:
      type: object
      required: [winter_design_c, summer_design_db_c, summer_design_rh_pct]
      properties:
        winter_design_c: { type: number, minimum: -60, maximum: 30 }
        summer_design_db_c: { type: number, minimum: 0, maximum: 55 }
        summer_design_rh_pct: { type: number, minimum: 1, maximum: 100 }

    TunnelRules:
      type: object
      description: |
        Когда туннель допустим. Нет — практика птицеводов: с 21-го дня и при наружной
        T не ниже 24 °C (допущение `tunnel_rules_default`, источник
        `practice_tunnel_rules_2026`).
      required: [min_day, min_outdoor_c]
      additionalProperties: false
      properties:
        min_day: { type: integer, minimum: 1, maximum: 42 }
        min_outdoor_c: { type: number, minimum: 0, maximum: 35 }

    Heaters:
      type: object
      required: [type, power_kw]
      properties:
        type: { type: string, enum: [gas_open, gas_indirect, electric] }
        power_kw: { type: number, exclusiveMinimum: 0, maximum: 5000 }

    # ── Сценарий 1 ────────────────────────────────────────────────────────────
    DesignRequest:
      type: object
      required: [house, envelope, flock, climate]
      properties:
        house: { $ref: "#/components/schemas/House" }
        envelope: { $ref: "#/components/schemas/Envelope" }
        flock:
          allOf:
            - $ref: "#/components/schemas/Flock"
            - type: object
              required: [cycle_days]
              properties:
                cycle_days:
                  type: integer
                  minimum: 21
                  maximum: 154
                  description: |
                    Последний день в корпусе. Бройлер — до 63 (иначе 422
                    broiler_day_out_of_range), индейка — до 154 (22 недели)
                first_day:
                  type: integer
                  minimum: 1
                  maximum: 153
                  default: 1
                  description: |
                    День посадки в этот корпус. Индейка на доращивании — день пересадки из
                    брудера: дни считаются с него, падёж mortality_pct — за дни в корпусе
                stage:
                  type: string
                  enum: [brooder, grow_out]
                  description: |
                    Только индейка, обязателен (иначе 422 turkey_stage_required); у бройлера —
                    422 stage_turkey_only. От него — норма вентиляторов минвентиляции (Hybrid:
                    18.3 / 27.5 м³/ч·м²) и предел плотности (Aviagen, гол/м²)
                hens:
                  type: object
                  additionalProperties: false
                  required: [growth_profile_id, birds]
                  description: |
                    Смешанное стадо индейки: индюшки того же кросса в этом корпусе (основной
                    профиль — индюки). Расчёт — по «средней птице» корпуса (assumption
                    mixed_flock_average_bird), до выборки — уставка смешанных стад
                  properties:
                    growth_profile_id: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$", example: converter-hens }
                    birds: { type: integer, minimum: 1, maximum: 200000 }
                    removal_day: { type: integer, minimum: 1, maximum: 154, description: "Последний день индюшек в корпусе; нет — до конца" }
        climate: { $ref: "#/components/schemas/Climate" }
        heaters:
          description: "Есть — проверить их достаточность; нет — только требуемая мощность"
          allOf: [{ $ref: "#/components/schemas/Heaters" }]
        pads:
          description: |
            Панели испарительного охлаждения на туннельном впуске. Есть — площадь
            по проектной скорости UGA и их сопротивление по кривой производителя (7090 — Munters CELdek, 7060/5090 — SANHE) входят
            в давление туннеля; нет — впуск считается открытым торцом.
          type: object
          properties:
            type: { type: string, enum: ["7090", "7060", "5090"], default: "7090" }
            thickness_mm: { type: integer, enum: [50, 75, 100, 150, 200, 300], default: 150 }
        tunnel_fan:
          description: |
            Характеристика туннельного вентилятора из каталога. Есть — сервер
            находит рабочую точку при сопротивлении корпуса и считает число
            вентиляторов; нет — отдаёт только требуемые расход и давление,
            при котором его читать в каталоге.
          allOf: [{ $ref: "#/components/schemas/FanCurve" }]
        tunnel_static_pressure_pa:
          type: number
          exclusiveMinimum: 0
          maximum: 150
          description: |
            Замеренное давление в туннельном режиме на похожем корпусе (те же
            панели, батареи, длина). Заменяет оценку сервера — по ней и
            подбираются вентиляторы.
        tunnel_rules: { $ref: "#/components/schemas/TunnelRules" }
        heating_margin_pct:
          type: number
          minimum: 0
          maximum: 50
          default: 15
          description: "Запас к пиковой мощности обогрева в equipment.heating_kw (практика поставщиков 10–20 %); в days[] — без запаса"

    DesignDay:
      type: object
      required: [day, weight_g, target_temp_c, qmin_m3h, qmin_basis, qmax_m3h, heating_need_kw]
      properties:
        day: { type: integer }
        weight_g: { type: number }
        target_temp_c: { type: number }
        qmin_m3h: { type: number, description: "Минимальная вентиляция при зимней расчётной T" }
        qmin_basis:
          type: string
          enum: [co2, moisture, guide]
          description: "guide — норма минвентиляции производителя кросса (индейка: Aviagen 1 м³/кг·ч, Hybrid 0.17 м³/ч·гол × неделя)"
        qmax_m3h: { type: number, description: "Максимальная — тепловой баланс / туннель при летней расчётной T" }
        heating_need_kw: { type: number, description: "Горелки при зимней расчётной T: UA·ΔT + обмен воздуха − явное тепло птицы; 0 — тепла птицы хватает" }
        air_exchange_m3h: { type: number, description: "Обмен для обогрева: max(Qmin, утечка при 4 Па)" }
        air_exchange_basis: { type: string, enum: [qmin, leakage] }
        target_rh_pct:
          type: number
          description: "Целевая RH, с которой посчитаны уставка и влажностный Qmin: из flock.target_rh_pct или из профиля. Нет — ни там, ни там"
        stocking_density_kg_m2:
          type: number
          description: |
            Только пол: живая птица (с падежом) × масса профиля / площадь пола, кг/м².
            Есть у любого кросса; уставку по ней считает только Cobb после 14-го дня
            (см. sources). Проходы не вычитаются — птица на подстилке занимает весь пол
        stocking_density_head_m2:
          type: number
          description: "Только индейка: живое поголовье на м² пола — в этих единицах предел Aviagen (находка turkey_density_high)"

    Equipment:
      type: object
      description: Рекомендация по оборудованию — диапазоны норм, а не модели
      required: [min_vent_fans_m3h, tunnel_fans_m3h, heating_kw]
      properties:
        min_vent_fans_m3h: { $ref: "#/components/schemas/Range" }
        tunnel_fans_m3h: { $ref: "#/components/schemas/Range" }
        tunnel_fans_basis:
          type: string
          enum: [floor_capacity, air_exchange, aisle_speed, air_speed]
          description: |
            Какое правило дало верхнюю границу tunnel_fans_m3h (по ней подбираются
            вентиляторы). Пол, Cobb §9.7 — больший из двух: floor_capacity — 200 м³/ч на м²
            пола, air_exchange — смена объёма корпуса за 40 с (высокий корпус).
            Клетки — aisle_speed: 4–5 м/с в проходах (практика). Индейка — air_speed:
            2 м/с в сечении корпуса (Hybrid CMG с. 51)
        tunnel_air_speed_ms:
          description: "Пол — в сечении; клетки — в проходах между рядами"
          allOf: [{ $ref: "#/components/schemas/Range" }]
        tunnel_free_section_m2: { type: number }
        tunnel_static_pressure_pa:
          type: object
          description: |
            Давление, при котором брать производительность вентиляторов из
            каталога. Батареи сужают сечение (скоростной напор растёт с v²) и
            добавляют потери по длине — при 0 Па каталог завышает расход.
          required: [total, section, inlet, pad, length_loss, basis]
          properties:
            total: { type: number }
            section: { type: number, description: "Скоростной напор в свободном сечении ½ρv²" }
            inlet: { type: number }
            pad: { type: number, description: "Панель по кривой производителя (7090 — Munters CELdek, 7060/5090 — SANHE)" }
            length_loss: { type: number, description: "Потери по длине корпуса; 0 — не оценены (см. assumptions)" }
            basis: { type: string, enum: [estimated, measured] }
        tunnel_fans:
          type: object
          description: "Только если передан tunnel_fan"
          required: [count, flow_per_fan_m3h, operating_pressure_pa]
          properties:
            count: { type: integer, description: "Для верхней границы целевой скорости" }
            flow_per_fan_m3h: { type: number, description: "В рабочей точке, не паспорт 0 Па" }
            operating_pressure_pa: { type: number }
        inlet_area_m2: { type: number, description: "Боковые клапаны минвентиляции под верх min_vent_fans_m3h: 750 cfm на ft² (UGA)" }
        pad_area_m2: { type: number, description: "Только с pads: площадь при проектной скорости UGA (150 мм — 1.78 м/с, 100 мм — 1.14 м/с)" }
        heating_kw: { type: number, description: "Пиковая потребность за цикл с запасом (см. assumptions)" }

    Range:
      type: object
      required: [min, max]
      properties:
        min: { type: number }
        max: { type: number }
        source_id: { type: string, example: cobb_2021_9_1 }

    DesignResult:
      type: object
      required: [request_id, envelope_ua_w_per_k, days, peak, equipment, warnings, assumptions, sources, api_version, app_version]
      properties:
        request_id:
          type: string
          example: req-3f9a1c2b7d4e
          description: "Идентификатор расчёта — тот же в заголовке X-Request-Id и в журнале вызовов сервера; называть его рядом с числами"
        envelope_ua_w_per_k: { type: number }
        days:
          type: array
          items: { $ref: "#/components/schemas/DesignDay" }
        peak:
          type: object
          required: [qmin_m3h, qmin_day, qmax_m3h, qmax_day, heating_kw, heating_day]
          properties:
            qmin_m3h: { type: number }
            qmin_day: { type: integer }
            qmax_m3h: { type: number }
            qmax_day: { type: integer }
            heating_kw: { type: number }
            heating_day: { type: integer }
        equipment: { $ref: "#/components/schemas/Equipment" }
        heaters_sufficient: { type: boolean, description: "Только если heaters переданы" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        assumptions:
          type: array
          items: { $ref: "#/components/schemas/Assumption" }
        sources:
          type: array
          items: { $ref: "#/components/schemas/Source" }
        api_version: { type: string, example: "1.0.0" }
        app_version: { type: string, example: "0.4.0 · 2a7c1ed" }

    # ── Сценарий 2 ────────────────────────────────────────────────────────────
    RequirementRequest:
      type: object
      required: [house, flock, conditions]
      properties:
        house: { $ref: "#/components/schemas/House" }
        envelope:
          description: "Нет — без теплового баланса и без проверки конденсата"
          allOf: [{ $ref: "#/components/schemas/Envelope" }]
        flock:
          type: object
          description: |
            `birds` — ТЕКУЩЕЕ поголовье: падежа (`mortality_pct`) здесь нет — он уже в
            числе, которое ввёл клиент, и был бы учтён дважды.
          required: [birds, growth_profile_id, housing, age_days]
          additionalProperties: false
          properties:
            birds: { type: integer, minimum: 1, maximum: 200000 }
            growth_profile_id: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$", example: ross308 }
            housing: { type: string, enum: [floor_litter, cages] }
            age_days: { type: integer, minimum: 0, maximum: 154, description: "Бройлер — до 70 (иначе 422 broiler_day_out_of_range), индейка — до 154" }
            target_rh_pct: { type: number, minimum: 40, maximum: 70, description: "Нет — RH профиля" }
            stage: { type: string, enum: [brooder, grow_out], description: "Только индейка, обязателен: предел плотности Aviagen" }
            hens:
              type: object
              additionalProperties: false
              required: [growth_profile_id, birds]
              description: "Смешанное стадо индейки: индюшки того же кросса, ТЕКУЩЕЕ поголовье"
              properties:
                growth_profile_id: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$" }
                birds: { type: integer, minimum: 1, maximum: 200000 }
        conditions:
          type: object
          required: [outdoor_t_c, outdoor_rh_pct]
          additionalProperties: false
          properties:
            outdoor_t_c: { type: number, minimum: -60, maximum: 55 }
            outdoor_rh_pct: { type: number, minimum: 0, maximum: 100 }
        heaters: { $ref: "#/components/schemas/Heaters" }
        tunnel_rules: { $ref: "#/components/schemas/TunnelRules" }

    RequirementResult:
      type: object
      required: [request_id, qmin_m3h, qmin_basis, qmax_m3h, target_temp_c, tunnel, findings, assumptions, sources, api_version, app_version]
      properties:
        request_id:
          type: string
          example: req-3f9a1c2b7d4e
          description: "Идентификатор расчёта — тот же в заголовке X-Request-Id и в журнале вызовов сервера"
        qmin_m3h: { type: number }
        qmin_basis: { type: string, enum: [co2, moisture, guide], description: "guide — норма производителя кросса (индейка)" }
        qmax_m3h: { type: number }
        target_temp_c: { type: number, description: "Уставка дня по методике кросса (источник — в `sources`): с поправкой на целевую RH, у Cobb — по плотности посадки" }
        weight_g: { type: number, description: "Масса по профилю на этот день" }
        target_rh_pct: { type: number, description: "Целевая RH, с которой посчитаны уставка и влажностный Qmin (из запроса или профиля)" }
        stocking_density_kg_m2: { type: number, description: "Только пол: живая птица × масса / площадь пола, кг/м²; у любого кросса" }
        stocking_density_head_m2: { type: number, description: "Только индейка: поголовье на м² пола" }
        air_exchange_m3h: { type: number, description: "Только с envelope: обмен для обогрева max(Qmin, утечка при 4 Па)" }
        tunnel:
          type: object
          required: [allowed, active, target_speed_ms, free_section_m2]
          properties:
            allowed: { type: boolean, description: "Возраст и наружная T допускают туннель (tunnel_rules; по умолчанию ≥ 21 дн. и ≥ 24 °C)" }
            active: { type: boolean, description: "Тепловой баланс требует туннеля (больше 50 % его расхода)" }
            effective_temp_c: { type: number, description: "Только при active и не у индейки: ощущаемая T у вентиляторов (воздух нагрет по длине корпуса)" }
            target_speed_ms:
              description: |
                Пол — скорость в сечении (Cobb §9.7, как у проекта); клетки — в проходах,
                4–5 м/с. Не выше предела Cobb §9.7 по возрасту для скорости у птицы.
              allOf: [{ $ref: "#/components/schemas/Range" }]
            free_section_m2: { type: number, description: "Сечение корпуса минус клеточные ряды" }
            bird_speed_ms:
              description: "Только клетки: оценка скорости у птицы ≈ 0.5 скорости в проходах; по ней — ощущаемая T"
              allOf: [{ $ref: "#/components/schemas/Range" }]
            effective_temp_limit_c: { type: number, example: 30, description: "Нет у индейки: таблица ощущаемой T и предел — бройлерные" }
        heating_need_kw: { type: number, description: "Только с envelope; обмен — max(Qmin, утечка при 4 Па)" }
        heater_duty_pct: { type: number, description: "Только с envelope и heaters" }
        findings:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        assumptions:
          type: array
          items: { $ref: "#/components/schemas/Assumption" }
        sources:
          type: array
          items: { $ref: "#/components/schemas/Source" }
        api_version: { type: string }
        app_version: { type: string }

    # ── Пояснения к результату ────────────────────────────────────────────────
    Finding:
      type: object
      description: Риск или предупреждение — код стабилен, текст на клиенте
      required: [code, severity]
      properties:
        code:
          type: string
          example: humidity_uncontrollable
          description: |
            humidity_uncontrollable, condensation_risk, heater_insufficient,
            heater_load_unknown, tunnel_not_allowed_age, effective_temp_above_limit,
            house_geometry_missing, ...
        severity: { type: string, enum: [info, warning, critical] }
        params: { type: object, additionalProperties: true }
        source_id: { type: string }

    Assumption:
      type: object
      required: [code]
      properties:
        code: { type: string, example: airtightness_class_assumed }
        params: { type: object, additionalProperties: true }
        source_id: { type: string, description: "Источник, на котором держится допущение (если есть)" }

    Source:
      type: object
      required: [id, citation]
      properties:
        id: { type: string, example: cigr_2002 }
        citation: { type: string, example: "CIGR (2002) Heat and moisture production at animal and house levels" }
        url: { type: string, format: uri }

    # ── Справочники ───────────────────────────────────────────────────────────
    SourceDetail:
      type: object
      required: [id, kind, citation, title, publisher, applies_to, statement, how_used]
      properties:
        id: { type: string, example: cobb_2021_9_7 }
        kind:
          type: string
          enum: [standard, manufacturer, research, extension, data, practice, unverified]
          description: |
            standard — стандарт; manufacturer — руководство или паспорт производителя;
            research — научная публикация; extension — методика университета (UGA);
            data — набор данных; practice — практика со слов владельца, не публикация;
            unverified — первоисточник не установлен
        citation: { type: string, description: "Та же короткая ссылка, что в `sources` ответов расчёта" }
        title: { type: string }
        publisher: { type: string }
        year: { type: integer }
        locator: { type: string, description: "Раздел, таблица, страница — где проверить", example: "§9.7 Tunnel Ventilation, с. 78" }
        url: { type: string, format: uri }
        applies_to: { type: string, description: "К какой части расчёта относится" }
        statement: { type: string, description: "Что утверждает источник — наш выверенный пересказ" }
        how_used: { type: string, description: "Как калькулятор это применяет" }
        limits: { type: string, description: "Где модель отличается от источника или чего он не покрывает" }

    ConstructionMaterial:
      type: object
      required: [id, name, lambda_w_mk, source_id]
      properties:
        id: { type: string, example: pir_core }
        name: { type: string, example: "PIR/PUR sandwich panel core (typical DoP)" }
        lambda_w_mk: { type: number, example: 0.022, description: "Расчётная теплопроводность" }
        density_kg_m3: { type: number }
        typical_thickness_mm: { type: array, items: { type: number }, example: [60, 80, 100, 120, 150] }
        source_id: { type: string, example: br443_2019_s3 }

    GrowthProfileSummary:
      type: object
      required: [id, name, builtin, species, first_day, last_day]
      properties:
        id: { type: string }
        name: { type: string }
        breed: { type: string }
        builtin: { type: boolean }
        species: { type: string, enum: [broiler, turkey] }
        sex: { type: string, enum: [male, female], description: "Пол стада, для которого дана кривая массы" }
        first_day: { type: integer }
        last_day: { type: integer }

    GrowthProfileDays:
      type: object
      required: [id, name, builtin, species, sources, days]
      properties:
        id: { type: string }
        name: { type: string }
        breed: { type: string }
        builtin: { type: boolean }
        species: { type: string, enum: [broiler, turkey] }
        sex: { type: string, enum: [male, female] }
        min_vent_norm:
          type: string
          enum: [aviagen_turkey_per_kg, hybrid_turkey_per_week]
          description: "Норма минвентиляции производителя: входит в Qmin = max(CO₂, норма, влага)"
        sources:
          type: object
          description: "Источник по колонкам: weight — масса, climate — температура и RH, weight_day0 — масса суточной птицы (индейка)"
          additionalProperties:
            type: object
            required: [citation]
            additionalProperties: true
            properties:
              citation: { type: string }
              source_id: { type: string, description: "Запись справочника `getSource`, если есть", example: ross_2025_t2_5 }
        days:
          type: array
          items:
            type: object
            required: [day, weight_g, temp_c, rh_pct, interpolated]
            properties:
              day: { type: integer }
              weight_g: { type: [number, "null"] }
              temp_c: { type: [number, "null"], description: "Уставка при RH профиля" }
              rh_pct: { type: [number, "null"] }
              interpolated: { type: boolean, description: "Значения достроены между опорными точками" }

    HousingSystem:
      type: object
      required: [id, supported]
      properties:
        id: { type: string, enum: [floor_litter, cages] }
        supported: { type: boolean }
        source_id: { type: string }

    ClimateDesign:
      type: object
      required: [request_id, winter_design_c, summer_design_db_c, summer_design_rh_pct, summer_mcwb_c, evap_wb_c, elevation_m, source_id]
      properties:
        request_id: { type: string, example: req-3f9a1c2b7d4e, description: "Номер запроса в журнале сервера" }
        winter_design_c: { type: number, description: "99.6 %" }
        summer_design_db_c: { type: number, description: "0.4 % сухой" }
        summer_design_rh_pct: { type: number, description: "Совпадающая RH" }
        summer_mcwb_c: { type: number, description: "Средний совпадающий мокрый" }
        evap_wb_c: { type: number, description: "0.4 % мокрый — предел панелей" }
        elevation_m: { type: number }
        source_id: { type: string, example: era5_open_meteo }
        citation: { type: string, example: "ERA5 via Open-Meteo (CC BY 4.0), 2015–2024" }
        latitude: { type: number, description: "Округлено до 0.1° — ключ кэша" }
        longitude: { type: number }
